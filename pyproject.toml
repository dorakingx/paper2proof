[project]
name = "paper2proof"
version = "0.1.0"
description = "Autonomous research reproducibility steward built with Strands Agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Tomoya Hatanaka" }]
dependencies = [
  "bedrock-agentcore==1.22.0",
  "boto3>=1.40.0,<2",
  "botocore[crt]==1.43.91",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.0,<1",
  "mangum==0.22.0",
  "pydantic>=2.11.0,<3",
  "pydantic-settings>=2.10.0,<3",
  "pypdf==6.18.0",
  "python-multipart>=0.0.20,<1",
  "strands-agents==1.55.1",
  "strands-agents-tools[agent-core-code-interpreter]==0.8.8",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "mypy>=1.17.0,<2",
  "pip-audit==2.10.1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.0,<7",
  "respx>=0.22.0,<1",
  "ruff>=0.12.0,<1",
]

[project.scripts]
paper2proof = "paper2proof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/agent/src/paper2proof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  "agentcore/.cache",
  "agentcore/cdk/cdk.out",
  "agentcore/cdk/dist",
  "agentcore/cdk/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["paper2proof"]
mypy_path = "services/agent/src"

[tool.coverage.run]
source = ["paper2proof"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
